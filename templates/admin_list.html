<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ede0c3;
    --paper-deep:#e1d0a6;
    --ink:#221a12;
    --ink-soft:#4a3c28;
    --red-deep:#8c1620;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:32px 20px 60px;
    background:var(--paper); color:var(--ink);
    font-family:'Bitter', Georgia, serif;
  }
  h1{
    font-family:'Fredoka','Nunito',sans-serif; text-transform:uppercase;
    font-size:clamp(22px,4vw,30px); margin:0 0 6px;
  }
  .count{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft); margin-bottom:24px;}
  .table-scroll{overflow-x:auto; border:2px solid var(--ink); background:#fff;}
  table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:820px;}
  th, td{padding:10px 12px; border-bottom:1px solid rgba(34,26,18,0.15); text-align:left; vertical-align:top;}
  th{
    font-family:'Fredoka','Nunito',sans-serif; font-size:11px; text-transform:uppercase;
    letter-spacing:0.4px; color:var(--red-deep); background:var(--paper-deep);
  }
  tr:nth-child(even){background:#faf6ec;}
  .empty{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft); padding:20px 0;}
</style>
</head>
<body>
  <h1>{{ title }}</h1>
  <p class="count">Усього заявок: {{ rows|length }}</p>

  {% if rows %}
  <div class="table-scroll">
    <table>
      <thead>
        <tr>{% for key, label in columns %}<th>{{ label }}</th>{% endfor %}</tr>
      </thead>
      <tbody>
        {% for row in rows %}
        <tr>{% for key, label in columns %}<td>{{ row[key] }}</td>{% endfor %}</tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  {% else %}
  <p class="empty">Поки що заявок немає.</p>
  {% endif %}
</body>
</html>
